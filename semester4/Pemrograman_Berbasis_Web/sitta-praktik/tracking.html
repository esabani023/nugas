<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking Pengiriman - SITTA</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-container">
        <!-- Desktop Sidebar -->
        <nav class="sidebar glass">
            <div class="brand">
                <img src="assets/logo-ut.png" alt="UT" onerror="this.src='https://via.placeholder.com/40?text=UT'">
                <span>SITTA UT</span>
            </div>
            <ul class="nav-links">
                <li><a href="dashboard.html"><i class="bi bi-house"></i> Dashboard</a></li>
                <li><a href="stok.html"><i class="bi bi-book"></i> Info Bahan Ajar</a></li>
                <li><a href="tracking.html" class="active"><i class="bi bi-truck"></i> Tracking</a></li>
                <li class="dropdown" onmouseenter="hoverDropdown(true)" onmouseleave="hoverDropdown(false)">
                    <a href="#" class="dropdown-btn"><i class="bi bi-file-earmark-text"></i> Laporan <i class="bi bi-chevron-right chevron-icon" style="margin-left: auto;"></i></a>
                    <div class="dropdown-container">
                        <a href="#" onclick="fiturBelumTersedia(event)">Monitoring Progress DO</a>
                        <a href="#" onclick="fiturBelumTersedia(event)">Rekap Bahan Ajar</a>
                    </div>
                </li>                
                <li><a href="#" onclick="fiturBelumTersedia(event)"><i class="bi bi-clock-history"></i> Histori Transaksi</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <button id="btn-theme-toggle" class="btn-icon"><i id="theme-icon" class="bi bi-moon-stars-fill"></i></button>
                <button id="btn-logout" class="btn-icon"><i class="bi bi-box-arrow-right"></i></button>
            </header>

            <h1 style="margin-bottom: 20px;">Tracking Pengiriman Bahan Ajar</h1>
            
            <div class="glass tracking-card">
                <form id="trackForm" style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 200px;">
                        <input type="text" id="noDo" class="form-control" placeholder="Masukkan No. Delivery Order (Contoh: 2023001234)" required>
                    </div>
                    <button type="submit" class="btn-primary"><i class="bi bi-search"></i> Lacak</button>
                </form>
            </div>

            <!-- Hasil Tracking -->
            <div id="tracking-result" class="tracking-result">
                <div class="glass tracking-card" style="margin-bottom: 20px; background-color: var(--ut-blue); color: var(--ut-white);">
                    <h2 id="res-nama" style="margin-bottom: 15px; color: var(--ut-white);">Nama</h2>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.9rem;">
                        <div>
                            <p>Status: <strong id="res-status" style="color: var(--ut-yellow);"></strong></p>
                            <p>Tanggal Kirim: <span id="res-tanggal"></span></p>
                        </div>
                        <div style="text-align: right;">
                            <img id="img-ekspedisi" src="" alt="Ekspedisi" class="ekspedisi-logo">
                            <p>Via: <span id="res-ekspedisi"></span></p>
                            <p>Total: <strong id="res-total"></strong></p>
                        </div>
                    </div>
                    
                    <div class="progress-bar-container">
                        <div id="progress-bar" class="progress-bar" style="background-color: var(--ut-yellow);"></div>
                    </div>
                </div>

                <div class="glass tracking-card">
                    <h3>Perjalanan Paket</h3><br>
                    <div id="timeline-container" class="timeline">
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile Bottom Navbar -->
    <nav class="mobile-navbar">
        <a href="dashboard.html"><i class="bi bi-house"></i> Dashboard</a>
        <a href="stok.html"><i class="bi bi-book"></i> Bahan Ajar</a>
        <a href="tracking.html" class="active"><i class="bi bi-truck"></i> Tracking</a>
        <a href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </nav>

    <!-- Data JS -->
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
