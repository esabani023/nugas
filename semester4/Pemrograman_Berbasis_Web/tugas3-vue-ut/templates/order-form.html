<form @submit.prevent="simpanDO">
    <div class="form-grid">
        <div class="form-group"><label>Nomor DO (Otomatis)</label><input type="text" class="form-control" v-model="generatedDo" disabled></div>
        <div class="form-group"><label>Tanggal Kirim</label><input type="date" class="form-control" v-model="formDO.tanggalKirim" required></div>
    </div>
    <div class="form-grid">
        <div class="form-group"><label>NIM</label>
            <input type="text" inputmode="numeric" class="form-control" v-model="formDO.nim" @input="formDO.nim = formDO.nim.replace(/[^0-9]/g, '')" required>
        </div>
        <div class="form-group"><label>Nama Mahasiswa</label>
            <input type="text" class="form-control" v-model="formDO.nama" @input="formDO.nama = formDO.nama.replace(/[0-9]/g, '')" required>
        </div>
    </div>
    <div class="form-grid">
        <div class="form-group">
            <label>Ekspedisi</label>
            <select class="form-control" v-model="formDO.ekspedisi" required>
                <option v-for="eks in pengirimanList" :value="eks.nama">{{ eks.nama }}</option>
            </select>
        </div>
        <div class="form-group">
            <label>Paket Bahan Ajar</label>
            <select class="form-control" v-model="formDO.paket" required>
                <option v-for="pkt in paket" :value="pkt.kode">{{ pkt.kode }} - {{ pkt.nama }}</option>
            </select>
            <small class="text-muted" v-if="selectedPaketDetail" style="display: block; margin-top: 5px;">
                <strong>Isi:</strong> {{ selectedPaketDetail.isi.join(', ') }} | <strong>Total Harga:</strong> {{ selectedPaketDetail.harga | currency }}
            </small>
        </div>
    </div>
    <button type="submit" class="btn-primary" style="margin-top: 15px;">Kirim DO Baru</button>
</form>
